<body class="bg-transparent">

    <!-- BACKGROUND VFX CANVAS LAYER (z-index: 1 — Captain America Flames Behind Circle) -->
    <canvas id="vfx-back-canvas" width="948" height="828"></canvas>

    <!-- FOREGROUND VFX CANVAS LAYER (z-index: 15 — Iron Man HUD & Thor Lightning) -->
    <canvas id="vfx-front-canvas" width="948" height="828"></canvas>

    <!-- PURE TRANSPARENT OVERLAY STAGE (z-index: 5 — Sits Cleanly Above Background Flames) -->
    <main id="overlay-stage" class="relative z-[5] w-full min-h-screen flex flex-col items-center justify-start pt-12 sm:pt-16 px-4">
        <div id="widget-container" class="flex flex-col items-center transition-transform duration-300 origin-top" style="transform: scale(1);">
            <!-- Top 3 Circular Badges Container (No background card behind the overlay) -->
            <div id="likers-grid" class="flex items-end justify-center gap-6 sm:gap-11 pt-8"></div>
        </div>
    </main>

    <!-- FLOATING STREAM CONTROLS (Hidden when pressing 'H' or clicking Hide UI) -->
    

    <!-- COLLAPSIBLE CUSTOMIZE & TIKFINITY LIVE SYNC DRAWER -->
    

    <!-- Toast Notification -->
    

    <script>
        // ==========================================
        // DEFAULT HERO FALLBACK AVATARS (SVG DATA URIs)
        // ==========================================
        const CAP_SHIELD_SVG = "data:image/svg+xml;utf8," + encodeURIComponent(`
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
                <defs>
                    <radialGradient id="capRed" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stop-color="#ef4444"/>
                        <stop offset="100%" stop-color="#991b1b"/>
                    </radialGradient>
                    <radialGradient id="capBlue" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stop-color="#2563eb"/>
                        <stop offset="100%" stop-color="#1e3a8a"/>
                    </radialGradient>
                </defs>
                <circle cx="60" cy="60" r="58" fill="url(#capRed)"/>
                <circle cx="60" cy="60" r="45" fill="#f8fafc"/>
                <circle cx="60" cy="60" r="33" fill="url(#capRed)"/>
                <circle cx="60" cy="60" r="21" fill="url(#capBlue)"/>
                <polygon points="60,42 65,55 79,55 68,63 72,76 60,68 48,76 52,63 41,55 55,55" fill="#ffffff"/>
            </svg>
        `);

        const IRON_REACTOR_SVG = "data:image/svg+xml;utf8," + encodeURIComponent(`
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
                <defs>
                    <radialGradient id="ironBg" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stop-color="#1e293b"/>
                        <stop offset="100%" stop-color="#090d16"/>
                    </radialGradient>
                    <linearGradient id="arcGlow" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#e0f2fe"/>
                        <stop offset="50%" stop-color="#38bdf8"/>
                        <stop offset="100%" stop-color="#0284c7"/>
                    </linearGradient>
                </defs>
                <circle cx="60" cy="60" r="58" fill="url(#ironBg)"/>
                <circle cx="60" cy="60" r="44" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="14 6"/>
                <polygon points="30,42 90,42 60,94" fill="none" stroke="url(#arcGlow)" stroke-width="7" stroke-linejoin="round"/>
                <polygon points="41,48 79,48 60,81" fill="#bae6fd" opacity="0.9"/>
            </svg>
        `);

        const THOR_BOLT_SVG = "data:image/svg+xml;utf8," + encodeURIComponent(`
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
                <defs>
                    <radialGradient id="thorBg" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stop-color="#0c4a6e"/>
                        <stop offset="100%" stop-color="#080d1a"/>
                    </radialGradient>
                </defs>
                <circle cx="60" cy="60" r="58" fill="url(#thorBg)"/>
                <circle cx="60" cy="60" r="46" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.5"/>
                <polygon points="66,24 38,64 58,64 52,96 82,54 62,54" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round"/>
            </svg>
        `);

        const DEFAULT_LIKERS = [
            { id: 'user_cap', username: '@captain_steve', likes: 12450, avatar: CAP_SHIELD_SVG, isCustomAvatar: false },
            { id: 'user_iron', username: '@tony_stark85', likes: 9820, avatar: IRON_REACTOR_SVG, isCustomAvatar: false },
            { id: 'user_thor', username: '@thor_odinson', likes: 7640, avatar: THOR_BOLT_SVG, isCustomAvatar: false }
        ];

        const STORAGE_KEY = 'marvel_aura_top3_likers_v2';

        const state = {
            likers: JSON.parse(JSON.stringify(DEFAULT_LIKERS)),
            layout: 'podium',
            scale: 100,
            bgMode: 'transparent',
            drawerOpen: false,
            uiHidden: false,
            ws: null,
            wsConnected: false
        };

        function loadSavedState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return;
                const parsed = JSON.parse(raw);
                if (Array.isArray(parsed.likers) && parsed.likers.length >= 3) {
                    const defaultAvatars = [CAP_SHIELD_SVG, IRON_REACTOR_SVG, THOR_BOLT_SVG];
                    state.likers = parsed.likers.map((item, idx) => ({
                        ...item,
                        avatar: item.isCustomAvatar ? item.avatar : (defaultAvatars[idx] || IRON_REACTOR_SVG)
                    }));
                }
                if (parsed.layout) state.layout = parsed.layout;
                if (parsed.scale) state.scale = parsed.scale;
            } catch (e) {
                // Fallback safely to default state
            }
        }

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({
                    likers: state.likers,
                    layout: state.layout,
                    scale: state.scale
                }));
            } catch (e) {
                // Ignore storage quota errors
            }
        }

        function resetDemoData() {
            state.likers = JSON.parse(JSON.stringify(DEFAULT_LIKERS));
            saveState();
            renderOverlay(true);
            renderEditorSlots();
            showToast('RESET TO DEFAULT HEROES');
        }

        // ==========================================
        // HERO CRESTS & BADGE RENDERING
        // ==========================================
        function getHeroCrestSVG(rank) {
            if (rank === 1) {
                // #1 Captain America Winged "A" Tactical Helmet Crest
                return `
                    <svg class="w-16 h-11 -mb-3 z-20 drop-shadow-[0_2px_6px_rgba(0,0,0,0.95)]" viewBox="0 0 120 75">
                        <path d="M18,52 L2,28 L26,38 L34,26 L38,48 Z" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
                        <path d="M102,52 L118,28 L94,38 L86,26 L82,48 Z" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
                        <path d="M32,58 C32,26 88,26 88,58 L76,64 L44,64 Z" fill="#1d4ed8" stroke="#93c5fd" stroke-width="2"/>
                        <text x="60" y="51" text-anchor="middle" fill="#ffffff" font-family="Orbitron, sans-serif" font-weight="900" font-size="22">A</text>
                    </svg>
                `;
            }
            if (rank === 2) {
                // #2 Iron Man Mark 85 Crimson & Gold Faceplate Crest
                return `
                    <svg class="w-14 h-10 -mb-2.5 z-20 drop-shadow-[0_2px_6px_rgba(0,0,0,0.95)]" viewBox="0 0 110 72">
                        <path d="M28,58 L22,26 L42,14 L68,14 L88,26 L82,58 Z" fill="#b91c1c" stroke="#f59e0b" stroke-width="2.5"/>
                        <path d="M34,54 L32,28 L46,22 L51,32 L59,32 L64,22 L78,28 L76,54 L66,60 L44,60 Z" fill="#fbbf24"/>
                        <polygon points="35,38 50,42 47,46 34,43" fill="#38bdf8"/>
                        <polygon points="75,38 60,42 63,46 76,43" fill="#38bdf8"/>
                    </svg>
                `;
            }
            // #3 Thor Asgardian Winged Helm Crest
            return `
                <svg class="w-15 h-10 -mb-2.5 z-20 drop-shadow-[0_2px_6px_rgba(0,0,0,0.95)]" viewBox="0 0 120 72">
                    <path d="M24,52 L4,18 L30,32 L38,16 L42,48 Z" fill="#f1f5f9" stroke="#38bdf8" stroke-width="1.8"/>
                    <path d="M96,52 L116,18 L90,32 L82,16 L78,48 Z" fill="#f1f5f9" stroke="#38bdf8" stroke-width="1.8"/>
                    <path d="M35,58 C35,28 85,28 85,58 Z" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
                    <rect x="57" y="34" width="6" height="24" fill="#cbd5e1"/>
                </svg>
            `;
        }

        function getHeroEmblemBadge(rank) {
            if (rank === 1) {
                return `<img src="${CAP_SHIELD_SVG}" alt="Cap Shield" class="w-7 h-7 rounded-full border border-white/80 shadow-md">`;
            }
            if (rank === 2) {
                return `<img src="${IRON_REACTOR_SVG}" alt="Arc Reactor" class="w-6 h-6 rounded-full border border-amber-400/90 shadow-md">`;
            }
            return `<img src="${THOR_BOLT_SVG}" alt="Thor Storm" class="w-6 h-6 rounded-full border border-sky-400/90 shadow-md">`;
        }

        function formatLikes(num) {
            return Number(num || 0).toLocaleString();
        }

        function renderOverlay(animatePop = false) {
            const grid = document.getElementById('likers-grid');
            if (!grid) return;

            const sorted = [...state.likers].sort((a, b) => b.likes - a.likes).slice(0, 3);
            const displayOrder = state.layout === 'podium'
                ? [
                    { liker: sorted[1], rank: 2 },
                    { liker: sorted[0], rank: 1 },
                    { liker: sorted[2], rank: 3 }
                ]
                : [
                    { liker: sorted[0], rank: 1 },
                    { liker: sorted[1], rank: 2 },
                    { liker: sorted[2], rank: 3 }
                ];

            grid.innerHTML = displayOrder.map(({ liker, rank }) => {
                const isFirst = rank === 1;
                const sizeClass = isFirst ? 'w-24 h-24 sm:w-28 sm:h-28' : 'w-20 h-20 sm:w-22 sm:h-22';
                const ringClass = isFirst ? 'ring-cap' : (rank === 2 ? 'ring-iron' : 'ring-thor');
                const floatClass = isFirst ? 'float-1' : (rank === 2 ? 'float-2' : 'float-3');
                const podiumOffset = (state.layout === 'podium' && isFirst) ? '-translate-y-5 sm:-translate-y-7' : '';
                const popClass = animatePop ? 'pop-animate' : '';
                const fallbackAvatar = rank === 1 ? CAP_SHIELD_SVG : (rank === 2 ? IRON_REACTOR_SVG : THOR_BOLT_SVG);

                return `
                    <div id="badge-slot-${rank}" class="relative flex flex-col items-center transition-transform duration-300 ${podiumOffset} ${floatClass} ${popClass}">
                        <!-- Top Hero Helmet Crest -->
                        ${getHeroCrestSVG(rank)}

                        <!-- Circular Red Ring + Real Profile Picture -->
                        <div id="hero-ring-${rank}" class="relative ${sizeClass} rounded-full hero-red-ring ${ringClass} flex items-center justify-center p-1">
                            <img src="${liker.avatar || fallbackAvatar}"
                                 onerror="this.onerror=null;this.src='${fallbackAvatar}';"
                                 alt="${liker.username}"
                                 class="w-full h-full rounded-full object-cover bg-zinc-950">

                            <!-- TOP 1 / TOP 2 / TOP 3 Pill (Bottom-Center, Matching Screenshot 235) -->
                            <span class="absolute -bottom-2 left-1/2 -translate-x-1/2 px-2 py-0.5 rounded-full bg-gradient-to-r from-red-700 via-red-600 to-orange-600 border border-amber-300/80 font-display font-black text-[9px] sm:text-[10px] text-white tracking-wider whitespace-nowrap shadow-md">
                                TOP ${rank}
                            </span>

                            <!-- Hero Emblem Mini Badge (Bottom-Right) -->
                            <div class="absolute -bottom-1 -right-1">
                                ${getHeroEmblemBadge(rank)}
                            </div>
                        </div>

                        <!-- Liker Username & Live Likes Counter -->
                        <div class="mt-3 flex flex-col items-center">
                            <div class="name-pill px-2.5 py-0.5 rounded-full max-w-[125px] sm:max-w-[145px]">
                                <p class="font-display font-bold text-[11px] sm:text-xs text-white truncate tracking-wide">
                                    ${liker.username}
                                </p>
                            </div>
                            <div class="mt-0.5 flex items-center gap-1 stream-text-outline font-display font-black text-xs sm:text-sm text-amber-300">
                                <span class="text-red-500">❤</span>
                                <span>${formatLikes(liker.likes)}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function spawnLikeSpark(rank) {
            const slot = document.getElementById(`badge-slot-${rank}`);
            if (!slot) return;
            const spark = document.createElement('div');
            spark.className = 'like-spark text-red-500 font-bold text-base';
            spark.style.left = `${40 + Math.random() * 20}%`;
            spark.style.top = '30%';
            spark.style.setProperty('--dx', `${(Math.random() - 0.5) * 44}px`);
            spark.textContent = '❤';
            slot.appendChild(spark);
            setTimeout(() => spark.remove(), 920);
        }

        function recordIncomingLikes(userId, username, count = 1, avatarUrl = null) {
            const cleanHandle = username.startsWith('@') ? username : `@${username}`;
            const existing = state.likers.find(
                l => l.id === userId || l.username.toLowerCase() === cleanHandle.toLowerCase()
            );

            if (existing) {
                existing.likes += Number(count) || 1;
                if (avatarUrl) {
                    existing.avatar = avatarUrl;
                    existing.isCustomAvatar = true;
                }
            } else {
                state.likers.push({
                    id: userId || `user_${Date.now()}`,
                    username: cleanHandle,
                    likes: Number(count) || 1,
                    avatar: avatarUrl || IRON_REACTOR_SVG,
                    isCustomAvatar: Boolean(avatarUrl)
                });
            }

            state.likers.sort((a, b) => b.likes - a.likes);
            saveState();
            renderOverlay(true);
            renderEditorSlots();

            const newRank = state.likers.slice(0, 3).findIndex(
                l => l.username.toLowerCase() === cleanHandle.toLowerCase()
            );
            if (newRank !== -1) {
                spawnLikeSpark(newRank + 1);
            }
        }

        function simulateLiveLikes() {
            const pool = [
                { id: 'user_cap', username: '@captain_steve' },
                { id: 'user_iron', username: '@tony_stark85' },
                { id: 'user_thor', username: '@thor_odinson' },
                { id: 'user_wanda', username: '@scarlet_witch' },
                { id: 'user_peter', username: '@spidey_ny' }
            ];
            const pick = pool[Math.floor(Math.random() * pool.length)];
            const boost = 250 + Math.floor(Math.random() * 900);
            recordIncomingLikes(pick.id, pick.username, boost, null);
        }

        function updateLikerField(index, field, value) {
            if (!state.likers[index]) return;
            if (field === 'likes') {
                state.likers[index].likes = Math.max(0, parseInt(value, 10) || 0);
            } else if (field === 'username') {
                const trimmed = value.trim() || '@viewer';
                state.likers[index].username = trimmed.startsWith('@') ? trimmed : `@${trimmed}`;
            } else if (field === 'avatar') {
                const trimmed = value.trim();
                if (trimmed) {
                    state.likers[index].avatar = trimmed;
                    state.likers[index].isCustomAvatar = true;
                }
            }
            saveState();
            renderOverlay(false);
        }

        function handleAvatarUpload(index, input) {
            const file = input.files && input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                if (state.likers[index] && e.target && e.target.result) {
                    state.likers[index].avatar = e.target.result;
                    state.likers[index].isCustomAvatar = true;
                    saveState();
                    renderOverlay(true);
                    renderEditorSlots();
                }
            };
            reader.readAsDataURL(file);
        }

        function renderEditorSlots() {
            const container = document.getElementById('editor-slots');
            if (!container) return;

            const sorted = [...state.likers].sort((a, b) => b.likes - a.likes);
            state.likers = sorted;

            const heroLabels = ['TOP #1 — CAPTAIN AMERICA', 'TOP #2 — IRON MAN', 'TOP #3 — THOR'];
            container.innerHTML = sorted.slice(0, 3).map((liker, idx) => `
                <div class="p-2.5 rounded-xl bg-zinc-900/90 border border-zinc-800 space-y-2">
                    <div class="flex items-center justify-between">
                        <span class="font-display font-bold text-[10px] text-red-400 tracking-wider">${heroLabels[idx]}</span>
                        <label class="cursor-pointer px-2 py-0.5 rounded bg-zinc-800 hover:bg-zinc-700 text-[10px] font-bold text-zinc-300">
                            Upload Photo
                            <input type="file" accept="image/*" class="hidden" onchange="handleAvatarUpload(${idx}, this)">
                        </label>
                    </div>
                    <div class="grid grid-cols-5 gap-1.5">
                        <input type="text" value="${liker.username}"
                            onchange="updateLikerField(${idx}, 'username', this.value)"
                            class="col-span-3 px-2 py-1 rounded bg-zinc-950 border border-zinc-700 text-xs text-white font-semibold focus:outline-none focus:border-red-500"
                            placeholder="@username">
                        <input type="number" value="${liker.likes}"
                            onchange="updateLikerField(${idx}, 'likes', this.value)"
                            class="col-span-2 px-2 py-1 rounded bg-zinc-950 border border-zinc-700 text-xs text-amber-300 font-bold focus:outline-none focus:border-red-500"
                            placeholder="Likes">
                    </div>
                </div>
            `).join('');
        }

        function getCleanOverlayHTML() {
            const clone = document.documentElement.cloneNode(true);
            const controls = clone.querySelector('#floating-controls');
            const drawer = clone.querySelector('#control-drawer');
            const toast = clone.querySelector('#toast-banner');
            const backCanvas = clone.querySelector('#vfx-back-canvas');
            const frontCanvas = clone.querySelector('#vfx-front-canvas');

        let wsReconnectTimer = null;

        let activeSockets = [];

        // Local TikOps Bridge (port 8090) + common local WebSocket endpoints
        const DEFAULT_WS_CANDIDATES = [
            'ws://localhost:8090/',

        function parseLiveLikePacket(rawData) {
            try {
                const packet = typeof rawData === 'string' ? JSON.parse(rawData) : rawData;
                if (!packet || typeof packet !== 'object') return null;

                // Support TikOps Developer API ({ type: "like", data: { ... } }), TikFinity, and IndoFinity schemas
                const rawEvent = (
                    packet.type ||
                    packet.event ||
                    packet.eventType ||
                    packet.action ||
                    (packet.data && (packet.data.type || packet.data.event)) ||
                    ''
                ).toString().toLowerCase();

                const payload = packet.data && typeof packet.data === 'object' ? packet.data : packet;
                const userObj = payload.user || payload.sender || payload.author || payload;

                const isLikeEvent =
                    rawEvent === 'like' ||
                    rawEvent === 'likes' ||
                    rawEvent === 'tiktok_like' ||
                    rawEvent === 'social_like' ||
                    rawEvent.includes('like') ||
                    (typeof (payload.like_count ?? payload.likeCount) === 'number' && !rawEvent);

                if (!isLikeEvent) return null;

                const rawHandle =
                    userObj.unique_id ||
                    userObj.uniqueId ||
                    userObj.username ||
                    userObj.handle ||
                    payload.unique_id ||
                    payload.uniqueId ||
                    payload.username ||
                    userObj.display_name ||
                    userObj.nickname ||
                    userObj.displayName ||
                    'viewer';

                const uid = (userObj.user_id || userObj.userId || userObj.id || payload.user_id || rawHandle).toString();
                const cleanHandle = rawHandle.toString().startsWith('@')
                    ? rawHandle.toString()
                    : `@${rawHandle}`;

                const count = Number(
                    payload.like_count ||
                    payload.likeCount ||
                    payload.likes ||
                    payload.count ||
                    payload.delta ||
                    1
                ) || 1;

                const pic =
                    userObj.profile_picture_url ||
                    userObj.profilePictureUrl ||
                    userObj.avatar_url ||
                    userObj.avatarUrl ||
                    userObj.avatar ||
                    userObj.profilePicture ||
                    payload.profile_picture_url ||
                    payload.profilePictureUrl ||
                    payload.avatar_url ||
                    payload.avatarUrl ||
                    null;

                return { uid, uname: cleanHandle, count, pic };
            } catch (err) {
                return null;
            }
        }

        function closeAllSockets() {
            activeSockets.forEach(s => {
                try { s.close(); } catch (e) {}
            });
            activeSockets = [];

        function connectWebSocket(isAuto = false) {
            clearTimeout(wsReconnectTimer);
            if (state.wsConnected && state.ws && state.ws.readyState === WebSocket.OPEN) {
                return;
            }

            const urlInput = document.getElementById('ws-url-input');
            const rawVal = (urlInput ? urlInput.value.trim() : '') || 'auto';
            const badge = document.getElementById('ws-status-badge');
            const btn = document.getElementById('ws-connect-btn');

            if (badge) {
                badge.textContent = isAuto ? 'SCANNING TIKOPS...' : 'CONNECTING...';
                badge.className = 'px-2 py-0.5 rounded text-[10px] font-bold bg-amber-950 text-amber-400';
            }

            const targets = (rawVal.toLowerCase() === 'auto' || rawVal === '')
                ? DEFAULT_WS_CANDIDATES
                : [rawVal];

            let connectedOne = false;
            let closedCount = 0;

            targets.forEach((wsUrl) => {
                try {
                    const socket = new WebSocket(wsUrl);
                    activeSockets.push(socket);

                    socket.onopen = () => {
                        if (connectedOne) {
                            try { socket.close(); } catch (e) {}
                            return;
                        }
                        connectedOne = true;
                        state.ws = socket;
                        state.wsConnected = true;

                        // Close any other candidate probes
                        activeSockets.forEach(other => {
                            if (other !== socket) {
                                try { other.close(); } catch (e) {}
                            }
                        });
                        activeSockets = [socket];

                        if (badge) {
                            badge.textContent = 'TIKOPS LIVE SYNCED';
                            badge.className = 'px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-950 text-emerald-400';
                        }
                        if (btn) btn.textContent = 'DISCONNECT';
                        if (!state.uiHidden) showToast(`CONNECTED TO TIKOPS / LIVE STREAM (${wsUrl})`);
                    };

                    socket.onmessage = (event) => {
                        const parsedLike = parseLiveLikePacket(event.data);
                        if (parsedLike) {
                            recordIncomingLikes(parsedLike.uid, parsedLike.uname, parsedLike.count, parsedLike.pic);
                        }
                    };

                    socket.onclose = () => {
                        closedCount++;
                        if (state.ws === socket) {
                            state.wsConnected = false;
                            state.ws = null;
                        }
                        if (!state.wsConnected && closedCount >= targets.length) {
                            if (badge) {
                                badge.textContent = wsAutoEnabled ? 'WAITING FOR TIKOPS...' : 'OFFLINE';
                                badge.className = 'px-2 py-0.5 rounded text-[10px] font-bold bg-zinc-800 text-zinc-400';
                            }
                            if (btn) btn.textContent = 'CONNECT';

                            if (wsAutoEnabled) {
                                wsReconnectTimer = setTimeout(() => connectWebSocket(true), 4000);
                            }
                        }
                    };

                    socket.onerror = () => {
                        // Handled cleanly by onclose
                    };
                } catch (e) {
                    closedCount++;
                }
            });
        }

        // ==========================================

        window.HeroVFXEngine = (() => {

            function getRingCenter(rank) {

            // #1 Captain America Flames (Rendered Behind Circle on backCanvas)
            function updateAndDrawCapFlames() {
                const c = getRingCenter(1);
                if (!c) return;

                // Spawn rim flames & rising embers behind circle
                for (let i = 0; i < 4; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const spawnR = c.radius * (0.88 + Math.random() * 0.14);
                    fireParticles.push({
                        x: c.x + Math.cos(angle) * spawnR,
                        y: c.y + Math.sin(angle) * spawnR,
                        vx: Math.cos(angle) * 0.45 + (Math.random() - 0.5) * 0.6,
                        vy: -1.1 - Math.random() * 1.6,
                        size: 9 + Math.random() * 11,
                        life: 1,

                bCtx.save();
                bCtx.globalCompositeOperation = 'lighter';

                // Subtle 30%-reduced inner fire corona behind ring
                const grad = bCtx.createRadialGradient(c.x, c.y - 4, c.radius * 0.72, c.x, c.y - 6, c.radius * 1.48);
                grad.addColorStop(0, 'rgba(255, 190, 60, 0.32)');
                grad.addColorStop(0.55, 'rgba(255, 68, 0, 0.22)');
                grad.addColorStop(1, 'rgba(220, 38, 38, 0)');
                bCtx.fillStyle = grad;
                bCtx.beginPath();
                bCtx.arc(c.x, c.y - 5, c.radius * 1.48, 0, Math.PI * 2);

                    const p = fireParticles[i];
                    p.x += p.vx + Math.sin(p.life * 10) * 0.35;
                    p.y += p.vy;
                    p.life -= p.decay;
                    p.size *= 0.965;

                    if (p.life <= 0 || p.size < 1) {

                        continue;

                    const pGrad = bCtx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);

                const c = getRingCenter(2);
                if (!c) return;
                hudAngle += 0.018;

                fCtx.save();
                fCtx.translate(c.x, c.y);

                // Rotating Gold Outer HUD Arcs + Orbiting Glowing Yellow Repulsor Dots
                fCtx.strokeStyle = 'rgba(245, 158, 11, 0.55)';
                fCtx.lineWidth = 1.6;
                for (let k = 0; k < 3; k++) {

                    fCtx.arc(0, 0, c.radius + 7, start, start + 0.85);

                    const goldGlow = fCtx.createRadialGradient(nx, ny, 0, nx, ny, 7);
                    goldGlow.addColorStop(0, 'rgba(254, 240, 138, 0.95)');
                    goldGlow.addColorStop(0.45, 'rgba(245, 158, 11, 0.65)');

                    fCtx.fillStyle = goldGlow;
                    fCtx.beginPath();
                    fCtx.arc(nx, ny, 7, 0, Math.PI * 2);

                    fCtx.arc(nx, ny, 2.2, 0, Math.PI * 2);

                fCtx.strokeStyle = 'rgba(56, 189, 248, 0.5)';
                fCtx.lineWidth = 1.2;
                for (let k = 0; k < 2; k++) {
                    const start = -hudAngle * 1.4 + k * Math.PI;
                    fCtx.beginPath();
                    fCtx.arc(0, 0, c.radius + 11, start, start + 0.65);
                    fCtx.stroke();

                    // Glowing Blue Arc Reactor Node at Arc Tip
                    const bx = Math.cos(start) * (c.radius + 11);
                    const by = Math.sin(start) * (c.radius + 11);
                    const blueGlow = fCtx.createRadialGradient(bx, by, 0, bx, by, 7);

                    fCtx.fillStyle = blueGlow;
                    fCtx.beginPath();

                    fCtx.fillStyle = '#e0f2fe';
                    fCtx.beginPath();
                    fCtx.arc(bx, by, 2.2, 0, Math.PI * 2);

            // #3 Thor Branching Storm Lightning
            function spawnThorBolt(c) {
                const startA = Math.random() * Math.PI * 2;
                const endA = startA + (Math.random() > 0.5 ? 1 : -1) * (0.8 + Math.random() * 1.2);
                const pts = [];
                const steps = 7;
                for (let s = 0; s <= steps; s++) {
                    const t = s / steps;
                    const a = startA + (endA - startA) * t;
                    const jitter = (s === 0 || s === steps) ? 0 : (Math.random() - 0.5) * 14;
                    const r = c.radius + 2 + jitter;
                    pts.push({ x: c.x + Math.cos(a) * r, y: c.y + Math.sin(a) * r });
                }
                thorBolts.push({ pts, life: 1 });
            }

            function drawBolt(pts, alpha) {
                if (pts.length < 2) return;
                fCtx.save();
                fCtx.globalCompositeOperation = 'lighter';
                fCtx.strokeStyle = `rgba(56, 189, 248, ${0.55 * alpha})`;
                fCtx.lineWidth = 3.2;

                fCtx.moveTo(pts[0].x, pts[0].y);
                for (let i = 1; i < pts.length; i++) fCtx.lineTo(pts[i].x, pts[i].y);
                fCtx.stroke();

                fCtx.strokeStyle = `rgba(224, 242, 254, ${0.85 * alpha})`;
                fCtx.lineWidth = 1.2;
                fCtx.stroke();
                fCtx.restore();
            }

            function updateAndDrawThorLightning() {
                const c = getRingCenter(3);

                boltTimer++;
                if (boltTimer % 11 === 0) {

                    drawBolt(b.pts, b.life);
                    b.life -= 0.14;
                    if (b.life <= 0) thorBolts.splice(i, 1);
                }
            }

            function loop() {

            if (window.HeroVFXEngine) {
                window.HeroVFXEngine.start();
            }

            // Auto-hide controls if loaded with ?clean=1
            if (window.location.search.includes('clean=1')) {
                toggleAllUI();
            }

            // Auto-connect to TikFinity / IndoFinity WebSocket on startup
            connectWebSocket(true);
        };
